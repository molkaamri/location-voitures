<!DOCTYPE html>

<html lang="fr"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Nos voitures | AutoPrestige</title> <style> *{box-sizing:border-box} body{margin:0;background:#f5f6f8;font-family:Arial,sans-serif;color:#172238} header{background:#101d35;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px} .logo{color:#f5b400;font-size:23px;font-weight:bold} nav{display:flex;gap:18px;flex-wrap:wrap} nav a{color:white;text-decoration:none;font-size:13px} nav a:hover{color:#f5b400} .catalogue{max-width:1150px;margin:auto;padding:35px 20px} .catalogue h1{font-size:27px;margin:0 0 25px} .car-container{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px} .car-card{background:white;border-radius:9px;overflow:hidden;box-shadow:0 3px 12px #00000012;padding-bottom:15px} .car-card img{width:100%;height:155px;display:block;object-fit:cover} .car-card h2{font-size:17px;margin:13px 12px 7px} .car-info{font-size:12px;color:#737b89;margin:0 12px} .car-price{font-size:15px;font-weight:bold;color:#bd8900;margin:13px 12px} .details-btn{display:inline-block;margin-left:12px;padding:9px 13px;background:#101d35;color:white;border:0;text-decoration:none;font-size:12px;border-radius:4px;cursor:pointer} .details-btn:hover{background:#dba300;color:#101d35} footer{text-align:center;background:#101d35;color:white;padding:18px;margin-top:25px;font-size:12px} .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10;align-items:center;justify-content:center;padding:15px} .modal-content{background:white;width:100%;max-width:440px;border-radius:12px;overflow:hidden;position:relative} .modal-content img{width:100%;height:220px;object-fit:cover;display:block} .modal-body{padding:20px} .modal-body h2{margin:0 0 10px} .modal-body p{font-size:14px;color:#687080;line-height:1.6} .modal-price{color:#bd8900!important;font-size:19px!important;font-weight:bold} .close{position:absolute;right:12px;top:12px;background:white;border:0;border-radius:50%;width:34px;height:34px;font-size:23px;cursor:pointer} .book-btn{display:inline-block;background:#101d35;color:white;padding:12px 18px;border-radius:5px;text-decoration:none;font-size:14px} @media(max-width:750px){.car-container{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}header{flex-direction:column}.car-card img{height:125px}} @media(max-width:430px){.car-container{grid-template-columns:1fr}} </style> </head> <body>

<header> <div class="logo">AutoPrestige.</div> <nav> <a href="index.html">Accueil</a> <a href="voitures.html">Voitures</a> <a href="services.html">Services</a> <a href="contact.html">Contact</a> </nav> </header>

<main class="catalogue"> <h1>Nos voitures</h1> <div class="car-container" id="cars"></div> </main>

<div class="modal" id="carModal"> <div class="modal-content"> <button class="close" id="closeModal">&times;</button> <img id="modalImage" src="" alt="Voiture"> <div class="modal-body"> <h2 id="modalTitle"></h2> <p id="modalInfo"></p> <p id="modalDescription"></p> <p class="modal-price" id="modalPrice"></p> <a id="modalBook" class="book-btn" href="contact.html">Réserver cette voiture</a> </div> </div> </div>

<footer><p>&copy; 2026 AutoPrestige — Location de voitures</p></footer>

<script> const voitures = [ { nom:"Porsche 911", info:"2 places · Automatique", description:"Voiture sportive et élégante, idéale pour une expérience premium.", prix:450, image:"https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=700&q=80" }, { nom:"Berline confort", info:"5 places · Automatique", description:"Confort et espace pour les déplacements en ville et les longs trajets.", prix:180, image:"https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?auto=format&fit=crop&w=700&q=80" }, { nom:"Chevrolet Camaro", info:"4 places · Automatique", description:"Un style sportif pour les conducteurs qui aiment se démarquer.", prix:300, image:"https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=700&q=80" }, { nom:"SUV familial", info:"5 places · Automatique", description:"Un véhicule spacieux pour les sorties et les voyages en famille.", prix:220, image:"https://images.unsplash.com/photo-1519641471654-76ce0107ad1b?auto=format&fit=crop&w=700&q=80" }, { nom:"Citadine moderne", info:"5 places · Manuelle", description:"Pratique et économique pour les déplacements quotidiens.", prix:120, image:"https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=700&q=80" } ]; const container=document.getElementById("cars"); voitures.forEach((voiture,index)=>{ const carte=document.createElement("article"); carte.className="car-card"; carte.innerHTML=` <img src="${voiture.image}" alt="${voiture.nom}"> <h2>${voiture.nom}</h2> <p class="car-info">${voiture.info}</p> <p class="car-price">${voiture.prix} DT / jour</p> <button class="details-btn" data-index="${index}">Voir détails</button> `; container.appendChild(carte); }); const modal=document.getElementById("carModal"); container.addEventListener("click",event=>{ const bouton=event.target.closest(".details-btn"); if(!bouton)return; const voiture=voitures[Number(bouton.dataset.index)]; document.getElementById("modalImage").src=voiture.image; document.getElementById("modalTitle").textContent=voiture.nom; document.getElementById("modalInfo").textContent=voiture.info; document.getElementById("modalDescription").textContent=voiture.description; document.getElementById("modalPrice").textContent=voiture.prix+" DT / jour"; document.getElementById("modalBook").href="contact.html?voiture="+encodeURIComponent(voiture.nom); modal.style.display="flex"; }); function fermerFenetre(){modal.style.display="none";} document.getElementById("closeModal").addEventListener("click",fermerFenetre); modal.addEventListener("click",event=>{if(event.target===modal)fermerFenetre();}); document.addEventListener("keydown",event=>{if(event.key==="Escape")fermerFenetre();}); </script>

</body> </html>
